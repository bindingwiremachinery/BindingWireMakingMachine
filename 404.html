<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | 404 - Binding Wire Machine</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/styles.css">
    <!-- GitHub Pages Single Page App Redirect Script -->
    <script type="text/javascript">
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
</head>
<body class="bg-slate-900 text-white font-sans flex flex-col min-h-screen items-center justify-center p-6 text-center">
    <div class="max-w-md">
        <h1 class="text-7xl font-extrabold text-rose-600 mb-4">404</h1>
        <h2 class="text-2xl font-bold mb-4">Machinery Spec Page Not Found</h2>
        <p class="text-gray-400 mb-8">The machinery catalog page or technical spec sheet you are looking for has been relocated or updated.</p>
        <a href="/" class="bg-rose-600 hover:bg-rose-700 text-white font-bold px-8 py-3 rounded transition-colors inline-block">
            Return to Homepage
        </a>
    </div>
</body>
</html>
