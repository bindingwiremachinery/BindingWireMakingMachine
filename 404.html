<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | Redirecting...</title>
  <script type="text/javascript">
    // SPA 404 Redirect Script for GitHub Pages
    var pathSegmentsToKeep = 0;
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body style="font-family: sans-serif; text-align: center; padding: 50px;">
  <h2>Page Not Found</h2>
  <p>Redirecting to the requested page...</p>
  <p>If you are not redirected automatically, <a href="/">click here to visit the homepage</a>.</p>
</body>
</html>
