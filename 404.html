<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Binding Wire Machine | Redirecting...</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // This script takes the current URL and redirects it to the index.html page
      // with the query parameter containing the path, which index.html then restores.
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
</head>
<body style="background: #0f172a; color: #ffffff; font-family: sans-serif; text-align: center; padding-top: 100px;">
    <h2>Redirecting to Binding Wire Machine...</h2>
    <p>Please wait while we route your request.</p>
</body>
</html>
